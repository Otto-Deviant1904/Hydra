[project]
name = "hydra"
version = "0.1.0"
description = "Next-generation password security research framework"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "sqlalchemy>=2.0",
    "websockets>=12.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "click>=8.0",
    "rich>=13.0",
    "psutil>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]
ml = [
    "numpy>=2.0",
    "onnxruntime>=1.18",
    "torch>=2.4",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
strict = true
python_version = "3.12"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "hydra.__main__",
    "hydra.api.main",
    "hydra.api.metrics",
    "hydra.api.websocket",
    "hydra.distribution.worker_manager",
    "hydra.engines.python_engine",
    "hydra.knowledge.database",
    "hydra.knowledge.repository",
    "hydra.ml.classifier",
]
ignore_errors = true

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
