[project]
name = "hydra"
version = "0.1.0"
description = "Next-generation password security research framework"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "sqlalchemy>=2.0",
    "websockets>=12.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "click>=8.0",
    "rich>=13.0",
    "psutil>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]
ml = [
    "numpy>=2.0",
    "onnxruntime>=1.18",
    "torch>=2.4",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
strict = true
python_version = "3.12"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["hydra.__main__", "hydra.api.main"]
disable_error_code = ["no-untyped-call", "untyped-decorator", "unused-ignore"]

[[tool.mypy.overrides]]
module = ["hydra.api.metrics"]
disable_error_code = ["no-any-return", "no-untyped-call", "no-untyped-def", "untyped-decorator"]

[[tool.mypy.overrides]]
module = ["hydra.api.websocket"]
disable_error_code = ["return-value"]

[[tool.mypy.overrides]]
module = ["hydra.distribution.worker_manager"]
disable_error_code = ["no-untyped-def"]

[[tool.mypy.overrides]]
module = ["hydra.engines.python_engine"]
disable_error_code = ["arg-type"]

[[tool.mypy.overrides]]
module = ["hydra.knowledge.database"]
disable_error_code = ["misc"]

[[tool.mypy.overrides]]
module = ["hydra.knowledge.repository"]
disable_error_code = ["assignment", "no-any-return", "return-value"]

[[tool.mypy.overrides]]
module = ["hydra.ml.classifier"]
disable_error_code = ["attr-defined"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
